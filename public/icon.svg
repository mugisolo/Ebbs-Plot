<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161f"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#FF5E3A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with safe zone border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Kesho stylized 'K' + Ticket Silhouette -->
  <g transform="translate(136, 116)" filter="url(#glow)">
    <!-- Main stem of K -->
    <rect x="20" y="20" width="48" height="240" rx="24" fill="url(#accentGrad)"/>
    <!-- Top diagonal arm -->
    <path d="M50 150 L180 35 C195 22 215 32 215 52 L215 65 C215 76 208 86 198 94 L80 180 Z" fill="url(#goldGrad)"/>
    <!-- Bottom diagonal arm with ticket notch cut aesthetic -->
    <path d="M60 140 L195 260 C208 271 216 288 210 305 L208 308 C202 320 188 325 175 315 L50 200 Z" fill="url(#accentGrad)"/>
  </g>
  <!-- Kampala City pulse dot -->
  <circle cx="360" cy="150" r="16" fill="#FFCC00" filter="url(#glow)"/>
  <!-- Subtitle Text -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="8">KESHO</text>
</svg>
